name: Update Resume Gist

on: push

jobs:
  update-resume-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Update Resume Gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.TOKEN }}
          gist_id: be730baa1549c5f310327837cad33373
          file_path: assets/json/resume.json
          
      - name: jsonresume-generator
        uses: Devleaps/jsonresume-generator@v1.1.0
        with:
          action: "render"
          file: "resume.json"
          folder: "assets/json"
          output-type: "PDF"
